<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Offline — Toollora</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #fcfcfd;
      --fg: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #3b82f6;
        --bg: #111827;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --card: #1f2937;
        --border: #374151;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo svg { width: 26px; height: 26px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: var(--muted); margin-bottom: 20px; }
    button {
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" fill="#ffffff" />
      </svg>
    </div>
    <h1 data-i18n="title">You&rsquo;re offline</h1>
    <p data-i18n="desc">This page isn&rsquo;t cached yet. Reconnect to the internet and visit it once, then it will be available offline.</p>
    <button data-i18n="retry" onclick="location.reload()">Try again</button>
    <div class="hint" data-i18n="hint">Visit a page online once to make it available offline.</div>
  </div>
  <script>
    (function () {
      var texts = {
        en: { title: 'You\u2019re offline', desc: 'This page isn\u2019t cached yet. Reconnect to the internet and visit it once, then it will be available offline.', retry: 'Try again', hint: 'Visit a page online once to make it available offline.' },
        ar: { title: '\u0623\u0646\u062a \u063a\u064a\u0631 \u0645\u062a\u0635\u0644', desc: '\u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062d\u0629 \u063a\u064a\u0631 \u0645\u062e\u0632\u0646\u0629 \u0628\u0639\u062f. \u0623\u0639\u062f \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a \u0648\u0632\u0631 \u0647\u0627 \u0645\u0631\u0629 \u0648\u0627\u062d\u062f\u0629\u060c \u0633\u062a\u0635\u0628\u062d \u0645\u062a\u0627\u062d\u0629 \u0628\u062f\u0648\u0646 \u0627\u062a\u0635\u0627\u0644.', retry: '\u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649', hint: '\u0632\u0631 \u0635\u0641\u062d\u0629 \u0628\u064a\u0646\u0645\u0627 \u0623\u0646\u062a \u0645\u062a\u0635\u0644 \u0644\u062a\u062a\u0648\u0641\u0631 \u0644\u062f\u064a\u0643 \u062f\u0648\u0646 \u0627\u062a\u0635\u0627\u0644.' },
        fr: { title: 'Vous \u00eates hors ligne', desc: 'Cette page n\u2019est pas encore mise en cache. Reconnectez-vous \u00e0 Internet et visitez-la une fois, elle sera ensuite disponible hors ligne.', retry: 'R\u00e9essayer', hint: 'Visitez une page en ligne une fois pour la rendre disponible hors ligne.' },
        es: { title: 'Est\u00e1s sin conexi\u00f3n', desc: 'Esta p\u00e1gina a\u00fan no est\u00e1 en cach\u00e9. Vuelve a conectarte a Internet y vis\u00edtala una vez, y estar\u00e1 disponible sin conexi\u00f3n.', retry: 'Reintentar', hint: 'Visita una p\u00e1gina en l\u00ednea una vez para que est\u00e9 disponible sin conexi\u00f3n.' }
      };
      var m = location.pathname.match(/^\/(en|ar|fr|es)(\/|$)/);
      var lang = m ? m[1] : 'en';
      var t = texts[lang] || texts.en;
      document.documentElement.lang = lang;
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      document.querySelector('[data-i18n="title"]').textContent = t.title;
      document.querySelector('[data-i18n="desc"]').textContent = t.desc;
      document.querySelector('[data-i18n="retry"]').textContent = t.retry;
      document.querySelector('[data-i18n="hint"]').textContent = t.hint;
      document.title = t.title + ' \u2014 Toollora';
    })();
  </script>
</body>
</html>
